<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1> Quiz Generator</h1>
        
        <div class="mode-toggle">
            <button id="btn-custom" class="active">Custom Questions</button>
            <button id="btn-pdf">PDF Upload</button>
        </div>

        <div id="custom-section" class="section active">
            <textarea id="content-input" placeholder="Paste your lecture notes, article, or any text here..."></textarea>
            <div class="options">
                <label>Questions: <input type="number" id="q-count" value="5" min="1" max="20"></label>
                <select id="q-type">
                    <option value="mixed">Mixed</option>
                    <option value="multiple_choice">Multiple Choice</option>
                    <option value="true_false">True/False</option>
                </select>
                <button id="generate-btn">Generate Quiz</button>
            </div>
        </div>

        <div id="pdf-section" class="section">
            <div id="drop-zone" class="drop-zone">
                <p>Drag & drop PDF here or click to browse</p>
                <input type="file" id="pdf-input" accept=".pdf" hidden>
            </div>
            <div id="pdf-loading" class="loading hidden">Reading PDF & generating questions...</div>
        </div>

        <div id="quiz-container" class="hidden">
            <div id="progress-bar"><div id="progress"></div></div>
            <div id="questions-list"></div>
            <button id="submit-btn" class="primary">Submit Quiz</button>
        </div>

        <div id="results-container" class="hidden">
            <div id="score-card"></div>
            <div id="detailed-results"></div>
            <button id="retry-btn">New Quiz</button>
        </div>

        <div id="loading" class="loading hidden">Generating questions with AI...</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
